# Production sur un serveur AWS EC2 (dépôt du site ; l'API est dans le dossier ./backend, dépôt buildsen_api) (une seule machine) : HTTPS automatique (Caddy), site Next.js, API FastAPI, PostgreSQL,
# tâches planifiées et fichiers sur disque. Rien d'autre n'est exposé que les ports 80 et 443.
#   cp .env.prod.example .env.prod   (puis remplir : voir DEPLOIEMENT-EC2.md)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: buildsen-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildsen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env.prod}
      POSTGRES_DB: buildsen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildsen"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://buildsen:${POSTGRES_PASSWORD}@db:5432/buildsen
      STORAGE_DIR: /data/uploads
      PLANS_ENABLED: "true"
      # PROXY_HOPS = nombre de relais devant l'API : Caddy puis le site Next.js
      PROXY_HOPS: "2"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # Alertes différées, rappels de fin de formule, formules provisoires expirées (toutes les 10 minutes) et nettoyage quotidien
  cron:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://buildsen:${POSTGRES_PASSWORD}@db:5432/buildsen
    command: python -m app.cronloop
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_SHOW_PRICING: "true"
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?définir INTERNAL_API_KEY dans .env.prod}
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN dans .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
